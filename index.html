<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>EMAI HQ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0">
    <!-- Fix 12: DNS-prefetch & preconnect hints -->
    <link rel="dns-prefetch" href="https://balasubramanian-pg.github.io">
    <link rel="preconnect" href="https://balasubramanian-pg.github.io" crossorigin>
    <!-- Fix 01: Preload critical web fonts with crossorigin -->
    <link rel="preload" href="./fonts/rubik-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/work-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Fix 02: Preload LCP hero background image with fetchpriority="high" -->
    <link rel="preload" href="./theme-1/projects.webp" as="image" type="image/webp" fetchpriority="high">
    <link rel="stylesheet" href="./fonts/fonts.css?v=muvlxbte">
    <link rel="stylesheet" href="./hyperplex.css">
    <link rel="stylesheet" href="./hq.css?v=muvlxbte">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23efbd91'/%3E%3C/svg%3E">
  </head>
  <body>
    <div id="root"></div>
    <!-- Fix 09: Non-blocking deferred script loading with immediate mock-api mount -->
    <script src='./mock-api.js'></script>
    <script defer src='./vendor/react.js'></script>
    <script defer src='./vendor/react-dom.js'></script>
    <script defer src='./vendor/classnames.js'></script>
    <script defer src="./hyperplex-review.js?v=muvlxbte"></script>
    <!-- Fix 17: Service Worker Registration for Instant Offline Cache -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
